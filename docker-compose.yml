services:
  sentinel-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3500:3500"
    volumes:
      - ./data:/app/data
      - sentinel-projects:/opt/sentinel/projects
      - /var/run/docker.sock:/var/run/docker.sock
      # Host visibility for System dashboard real probes/logs.
      - /var/log:/var/log
      - /var/cache:/var/cache
      - /etc:/etc:ro
      - /run:/run:ro
    group_add:
      - adm
    environment:
      SENTINEL_API_KEY: ${SENTINEL_API_KEY:-cambia_esto}
      SENTINEL_PORT: "3500"
      SENTINEL_DATA_DIR: /app/data
      SENTINEL_PROJECTS_DIR: /opt/sentinel/projects
      SENTINEL_USE_HOST_NSENTER: ${SENTINEL_USE_HOST_NSENTER:-true}
      SENTINEL_MAINTENANCE_SCRIPT: ${SENTINEL_MAINTENANCE_SCRIPT:-/app/apps/api/scripts/maintenance.sh}
      SENTINEL_RUN_MAINTENANCE_IN_HOST: ${SENTINEL_RUN_MAINTENANCE_IN_HOST:-false}
    privileged: true
    restart: unless-stopped

  sentinel-ui:
    build:
      context: .
      dockerfile: apps/ui/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_API_KEY: ${SENTINEL_API_KEY:-cambia_esto}
    ports:
      - "${SENTINEL_UI_PORT:-4001}:80"
    depends_on:
      - sentinel-api
    restart: unless-stopped

volumes:
  sentinel-projects:
