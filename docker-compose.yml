services:
  sentinel-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3500:3500"
    volumes:
      - ./data:/app/data
      - sentinel-projects:/opt/sentinel/projects
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      SENTINEL_API_KEY: ${SENTINEL_API_KEY:-cambia_esto}
      SENTINEL_PORT: "3500"
      SENTINEL_DATA_DIR: /app/data
      SENTINEL_PROJECTS_DIR: /opt/sentinel/projects
    restart: unless-stopped

  sentinel-ui:
    build:
      context: .
      dockerfile: apps/ui/Dockerfile
      args:
        # Vacío: el navegador usa el mismo origen y nginx reenvía /api → sentinel-api
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_API_KEY: ${SENTINEL_API_KEY:-cambia_esto}
    ports:
      - "${SENTINEL_UI_PORT:-4000}:80"
    depends_on:
      - sentinel-api
    restart: unless-stopped

volumes:
  sentinel-projects:
